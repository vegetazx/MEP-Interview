<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MEP Screening — Admin</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#f5f5f4; margin:0; padding:24px; color:#222; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .card { background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); margin-bottom:20px; }
  h1 { font-size:22px; margin-top:0; }
  input { padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-right:8px; }
  button { background:#1a1a1a; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:14px; cursor:pointer; }
  table { width:100%; border-collapse: collapse; font-size:13px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid #eee; vertical-align:top; }
  th { color:#777; font-weight:600; }
  .badge { padding:3px 8px; border-radius:12px; font-size:12px; font-weight:600; }
  .advance { background:#dcfce7; color:#166534; }
  .hold { background:#fef9c3; color:#854d0e; }
  .reject { background:#fee2e2; color:#991b1b; }
  .pending { background:#eee; color:#666; }
  #linkOut { margin-top:10px; font-size:13px; word-break: break-all; }
  .notes { font-size:12px; color:#555; max-width:260px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>Admin password</h1>
    <input id="pw" type="password" placeholder="Admin password" />
    <button onclick="unlock()">Unlock</button>
  </div>

  <div class="card hidden" id="createCard">
    <h1>Create a one-time screening link</h1>
    <input id="candName" placeholder="Candidate name" />
    <input id="candPhone" placeholder="Phone (optional)" />
    <button onclick="createLink()">Generate link</button>
    <div id="linkOut"></div>
  </div>

  <div class="card hidden" id="resultsCard">
    <h1>Results</h1>
    <table id="resultsTable">
      <thead>
        <tr><th>Candidate</th><th>Status</th><th>Recommendation</th><th>Scores</th><th>Summary / Red flags</th></tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>

</div>

<script>
  let PW = '';

  function badge(rec) {
    if (!rec) return '<span class="badge pending">In progress</span>';
    const cls = rec.toLowerCase() === 'advance' ? 'advance' : rec.toLowerCase() === 'hold' ? 'hold' : 'reject';
    return `<span class="badge ${cls}">${rec}</span>`;
  }

  async function unlock() {
    PW = document.getElementById('pw').value;
    const res = await fetch(`/admin/api/results?pw=${encodeURIComponent(PW)}`);
    if (!res.ok) { alert('Wrong password'); return; }
    document.getElementById('createCard').classList.remove('hidden');
    document.getElementById('resultsCard').classList.remove('hidden');
    loadResults();
  }

  async function createLink() {
    const candidateName = document.getElementById('candName').value.trim();
    const candidatePhone = document.getElementById('candPhone').value.trim();
    if (!candidateName) return alert('Enter a candidate name');
    const res = await fetch('/admin/api/create-link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': PW },
      body: JSON.stringify({ candidateName, candidatePhone })
    });
    const data = await res.json();
    document.getElementById('linkOut').innerHTML = `Send this link to the candidate (works once):<br><a href="${data.link}" target="_blank">${data.link}</a>`;
    loadResults();
  }

  async function loadResults() {
    const res = await fetch(`/admin/api/results?pw=${encodeURIComponent(PW)}`);
    const sessions = await res.json();
    const body = document.getElementById('resultsBody');
    body.innerHTML = '';
    sessions.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    for (const s of sessions) {
      const status = s.completed ? 'Completed' : s.started ? `In progress (Q${s.currentQuestionIndex + 1}/10)` : 'Link not opened yet';
      let scoresHtml = '—';
      let summaryHtml = '—';
      if (s.score && !s.score.error) {
        const sc = s.score;
        scoresHtml = `Exp ${sc.experience_fit.score} · Pedigree ${sc.project_pedigree.score} · Tech ${sc.technical_depth.score} · Comm ${sc.communication.score} · Salary/Logistics ${sc.salary_logistics_fit.score}`;
        const flags = sc.red_flags && sc.red_flags.length ? `<br><em>Flags:</em> ${sc.red_flags.join('; ')}` : '';
        summaryHtml = `<div class="notes">${sc.overall_summary}${flags}</div>`;
      } else if (s.score && s.score.error) {
        summaryHtml = `<div class="notes">${s.score.error}</div>`;
      }
      body.innerHTML += `<tr>
        <td>${s.candidateName}${s.candidatePhone ? '<br><span style="color:#999">' + s.candidatePhone + '</span>' : ''}</td>
        <td>${status}</td>
        <td>${badge(s.score && s.score.overall_recommendation)}</td>
        <td>${scoresHtml}</td>
        <td>${summaryHtml}</td>
      </tr>`;
    }
  }
</script>
</body>
</html>
